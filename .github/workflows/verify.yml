name: API verification
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: auctor_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ci-test-password@localhost:5432/auctor_test
      AUCTOR_TEST_DSN: postgresql://postgres:ci-test-password@localhost:5432/auctor_test
      AUCTOR_TEST_LOCAL: '1'
      AUCTOR_TEST_PG_BIN: /usr/lib/postgresql/16/bin
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Install PostgreSQL recovery tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
          test -x "$AUCTOR_TEST_PG_BIN/pg_dump"
          test -x "$AUCTOR_TEST_PG_BIN/pg_restore"
      - run: python -m pytest -q
